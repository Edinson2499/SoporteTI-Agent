<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Agente de Soporte IT</title>
<style>
  :root {
    --azul: #0b5ed7;
    --azul-oscuro: #063a8c;
    --teal: #0dcaf0;
    --fondo: #0f1720;
    --tarjeta: #16212e;
    --texto: #e6edf3;
    --texto-suave: #9fb0c0;
    --exito: #2ecc71;
    --alerta: #f1c40f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--fondo), #101c2c);
    font-family: "Segoe UI", Arial, sans-serif;
    color: var(--texto);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 560px;
    background: var(--tarjeta);
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    padding: 28px;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 20px;
  }
  .robot {
    font-size: 42px;
    background: linear-gradient(135deg, var(--azul), var(--teal));
    width: 64px;
    height: 64px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  h1 {
    font-size: 20px;
    margin: 0;
  }
  h1 span {
    display: block;
    font-size: 13px;
    font-weight: normal;
    color: var(--texto-suave);
  }
  label {
    display: block;
    font-size: 13px;
    color: var(--texto-suave);
    margin: 14px 0 6px;
  }
  input, textarea {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.12);
    background: #0d1620;
    color: var(--texto);
    font-size: 14px;
  }
  textarea { resize: vertical; min-height: 70px; }
  button {
    margin-top: 20px;
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--azul), var(--azul-oscuro));
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .respuesta {
    margin-top: 20px;
    padding: 16px;
    border-radius: 10px;
    background: #0d1620;
    border-left: 4px solid var(--teal);
    display: none;
    white-space: pre-wrap;
    font-size: 14px;
  }
  .respuesta.ok { border-left-color: var(--exito); }
  .respuesta.escalar { border-left-color: var(--alerta); }
  .respuesta.error { border-left-color: #e74c3c; }
  .meta {
    margin-top: 10px;
    font-size: 12px;
    color: var(--texto-suave);
  }
  .url-config {
    margin-bottom: 4px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="robot">🤖</div>
      <h1>Agente de Soporte IT
        <span>Pregunta directamente a la Lambda desplegada en AWS</span>
      </h1>
    </div>

    <label for="url">URL de la funcion (Function URL)</label>
    <input id="url" class="url-config" type="text"
      value="https://cv5nihiq3h47ybhcqn6ifcegfi0olxdj.lambda-url.us-east-2.on.aws/" />

    <label for="userId">Tu usuario</label>
    <input id="userId" type="text" value="usuario-web" />

    <label for="question">Cual es tu problema?</label>
    <textarea id="question" placeholder="Ej: no tengo internet en mi portatil"></textarea>

    <button id="btnPreguntar">Preguntar al agente</button>

    <div id="respuesta" class="respuesta"></div>
  </div>

<script>
  const btn = document.getElementById("btnPreguntar");
  const caja = document.getElementById("respuesta");

  btn.addEventListener("click", async () => {
    const url = document.getElementById("url").value.trim();
    const userId = document.getElementById("userId").value.trim() || "usuario-web";
    const question = document.getElementById("question").value.trim();

    caja.style.display = "block";
    caja.className = "respuesta";
    caja.textContent = "Consultando al agente...";
    btn.disabled = true;

    const payload = {
      request_id: "req-" + Date.now(),
      user_id: userId,
      question: question,
      channel: "web-test"
    };

    try {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (data.status === "error") {
        caja.className = "respuesta error";
        caja.textContent = "Error: " + JSON.stringify(data.missing_fields || data);
      } else {
        caja.className = data.next_action === "escalar_a_humano" ? "respuesta escalar" : "respuesta ok";
        caja.innerHTML =
          "<strong>Respuesta:</strong> " + data.answer +
          '<div class="meta">Fuente: ' + data.source +
          " · Accion: " + data.next_action +
          " · request_id: " + data.request_id + "</div>";
      }
    } catch (err) {
      caja.className = "respuesta error";
      caja.textContent = "No se pudo conectar con la funcion: " + err.message;
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
